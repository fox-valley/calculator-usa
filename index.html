<!DOCTYPE html>
<html lang="pl">
<head>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Kalkulator USA 🇺🇸</title>
        <link rel="manifest" href="manifest.json">
        <meta name="theme-color" content="#121214">
        <link rel="stylesheet" href="style.css">
    </head>
<body>

<div class="card">
    <h2>Kalkulator USA 🇺🇸</h2>

    <div class="form-group">
        <label for="price">Cena z etykiety ($):</label>
        <input type="number" id="price" placeholder="0.00" step="0.01" oninput="calculate()">
    </div>

    <div class="grid-row">
        <div class="form-group">
            <label for="tax">Podatek (TAX):</label>
            <select id="tax" onchange="calculate()">
                <option value="8.875">Nowy Jork (8.875%)</option>
                <option value="0">New Hampshire (0%)</option>
                <option value="6">Pensylwania (6%)</option>
                <option value="6">Michigan (6%)</option>
                <option value="6.25">Massachusetts (6.25%)</option>
                <option value="6.25">Illinois (6.25%)</option>
                <option value="6.35">Connecticut (6.35%)</option>
                <option value="5.75">Ohio (5.75%)</option>
                <option value="7">Indiana (7%)</option>
                <option value="0">Brak (0%)</option>
            </select>
        </div>
        <div class="form-group">
            <label for="tip">Napiwek (Tip):</label>
            <select id="tip" onchange="calculate()">
                <option value="0">Bez napiwku</option>
                <option value="15">Minimum (15%)</option>
                <option value="18" selected>Standard (18%)</option>
                <option value="20">Extra (20%)</option>
            </select>
        </div>
    </div>

    <div class="form-group">
        <label for="usdpln">Kurs USD/PLN:</label>
        <input type="number" id="usdpln" value="4.00" step="0.01" oninput="calculate()">
    </div>

    <div class="result-box">
        <div class="result-line">
            <span>W złotówkach:</span>
            <span id="resPLN">0.00 zł</span>
        </div>
        <div class="result-line total">
            <span>Do zapłaty przy kasie:</span>
            <span id="resUSD">$0.00</span>
        </div>
    </div>

</div>
<script src="script.js"></script>
</body>
</html>
